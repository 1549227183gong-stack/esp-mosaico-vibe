dependencies:
  idf: ">=6.2"
  esp-mosaico-bsp:
    version: "*"
    override_path: "../../../submodule/esp-mosaico-bsp/components/esp-mosaico-bsp"
  esp_iris:
    version: "*"
    override_path: "../../../submodule/esp-mosaico-utils/ESP-Iris/components/esp_iris"
  espressif/esp-gsp: "==1.5.1"
  # 本地补丁版 esp_display_present（基线 1.1.1）：TE 局部脏区推送实验。
  # 通过 override_path 覆盖 esp-gsp 的传递依赖，防止组件管理器用注册表
  # 版本重新下载并覆盖本地修改。
  espressif/esp_display_present:
    version: "*"
    override_path: "../components/espressif__esp_display_present"
  # The BSP display adapter uses headers deprecated by LVGL 9.6.
  lvgl/lvgl: "==9.5.0"
